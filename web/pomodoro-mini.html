<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Tramo · Pomodoro</title>
  <style>
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('./fonts/PlusJakartaSans-latin.woff2') format('woff2'); font-weight: 200 800; font-style: normal; font-display: swap; }
    /* Colores por aspecto de Tramo; el widget copia el de la app. */
    :root { --bg: rgba(18, 25, 38, .74); --text: #fff; --muted: #EDF0F6; --accent: #F2C6B6; --on-accent: #232D3B; --rest: #A7D8C3; --track: rgba(255, 255, 255, .16); --line: rgba(255, 255, 255, .22); --shadow: rgba(8, 12, 20, .38); }
    [data-theme="dark"] { --bg: rgba(13, 17, 15, .8); --text: #F4F4F5; --muted: #C9CFCB; --accent: #6EE7B7; --on-accent: #0D110F; --rest: #93C5FD; --track: rgba(255, 255, 255, .14); --line: rgba(110, 231, 183, .24); }
    [data-theme="natural"] { --bg: rgba(248, 247, 244, .86); --text: #18181B; --muted: #45494d; --accent: #1B3B2B; --on-accent: #F8F7F4; --rest: #4F8266; --track: rgba(24, 24, 27, .12); --line: rgba(255, 255, 255, .85); --shadow: rgba(24, 40, 30, .22); }
    [data-theme="warm"] { --bg: rgba(250, 246, 240, .86); --text: #29211E; --muted: #5a4a44; --accent: #C2593F; --on-accent: #FAF6F0; --rest: #5F8A64; --track: rgba(41, 33, 30, .12); --line: rgba(255, 255, 255, .85); --shadow: rgba(60, 35, 25, .22); }
    [data-theme="ocean"] { --bg: rgba(244, 248, 252, .86); --text: #0F172A; --muted: #3b4760; --accent: #2563EB; --on-accent: #fff; --rest: #0E8F80; --track: rgba(15, 23, 42, .12); --line: rgba(255, 255, 255, .85); --shadow: rgba(20, 40, 80, .22); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; }
    body { padding: 8px; overflow: hidden; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color: var(--text); }
    main { position: relative; display: flex; align-items: center; gap: 16px; height: 100%; padding: 14px 18px 14px 16px; container-type: size; border: 1px solid var(--line); border-radius: 22px; background: var(--bg); box-shadow: 0 12px 34px -8px var(--shadow), inset 0 1px 0 var(--line); -webkit-backdrop-filter: blur(24px) saturate(130%); backdrop-filter: blur(24px) saturate(130%); -webkit-app-region: drag; }
    .ring { position: relative; flex: none; width: min(100cqh, 46cqw); aspect-ratio: 1; max-width: 118px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
    .ring .track { stroke: var(--track); }
    .ring .bar { stroke: var(--accent); stroke-dasharray: 289.03; stroke-dashoffset: 289.03; transition: stroke-dashoffset .5s linear, stroke .3s ease; }
    .is-rest .ring .bar { stroke: var(--rest); }
    #time { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(17px, 15cqw, 27px); font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; }
    .info { display: flex; flex: 1; flex-direction: column; justify-content: center; gap: 8px; min-width: 0; }
    .phase { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .phase i { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); transition: background .3s; }
    .is-rest .phase i { background: var(--rest); }
    .is-running .phase i { animation: pulse 1.6s ease-in-out infinite; }
    #task { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0; font-size: 13px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
    #toggle { align-self: flex-start; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); cursor: pointer; transition: transform .15s ease; -webkit-app-region: no-drag; }
    #toggle:hover { transform: scale(1.06); }
    #toggle:active { transform: scale(.96); }
    #toggle:focus-visible, #close:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    #toggle svg { width: 18px; height: 18px; fill: currentColor; }
    #close { position: absolute; top: 8px; right: 10px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: var(--track); color: var(--text); font: inherit; font-size: 15px; line-height: 1; opacity: 0; pointer-events: none; cursor: pointer; transition: opacity .15s; -webkit-app-region: no-drag; }
    main:hover #close, #close:focus-visible { opacity: 1; pointer-events: auto; }
    @container (max-width: 270px) { #task { display: none; } .info { gap: 10px; } }
    @container (max-height: 96px) { .phase { display: none; } }
    #task[hidden] { display: none; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .is-running .phase i { animation: none; } .ring .bar { transition: none; } }
  </style>
</head>
<body>
  <main id="card" aria-label="Widget Pomodoro">
    <button type="button" id="close" aria-label="Cerrar widget" title="Cerrar">×</button>
    <div class="ring">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46" /><circle class="bar" id="bar" cx="50" cy="50" r="46" /></svg>
      <div id="time" role="timer">25:00</div>
    </div>
    <div class="info">
      <div class="phase"><i></i><span id="phase">Concentración</span></div>
      <p id="task" hidden></p>
      <button type="button" id="toggle" aria-label="Iniciar" title="Iniciar o pausar"></button>
    </div>
  </main>
  <script>
    let state = { phase: 'focus', remaining: 1500, total: 1500, running: false, task: '', theme: 'default' };
    let deadline = 0;
    const $ = id => document.getElementById(id);
    const CIRCUMFERENCE = 2 * Math.PI * 46;
    const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2Z"/></svg>';
    const PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
    $('close').addEventListener('click', () => window.nexo?.closePomodoroMini?.());
    $('toggle').addEventListener('click', () => window.nexo?.togglePomodoroFromMini?.());
    const format = seconds => `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    function render() {
      const seconds = state.running ? Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) : state.remaining;
      const total = Math.max(1, state.total || seconds || 1);
      const done = Math.min(1, Math.max(0, 1 - seconds / total));
      const card = $('card');
      card.className = (state.phase === 'break' ? 'is-rest ' : '') + (state.running ? 'is-running' : '');
      document.documentElement.dataset.theme = state.theme || 'default';
      $('time').textContent = format(seconds);
      $('bar').style.strokeDashoffset = String(CIRCUMFERENCE * (1 - done));
      $('phase').textContent = state.phase === 'break' ? 'Descanso' : 'Concentración';
      $('task').textContent = state.task || '';
      $('task').hidden = !state.task;
      const label = state.running ? 'Pausar' : seconds < total ? 'Continuar' : 'Iniciar';
      $('toggle').innerHTML = state.running ? PAUSE : PLAY;
      $('toggle').setAttribute('aria-label', label);
      $('toggle').title = label;
    }
    window.nexo?.onPomodoroMiniState?.(next => {
      state = next;
      deadline = state.running ? Date.now() + state.remaining * 1000 : 0;
      render();
    });
    window.setInterval(render, 250);
    render();
  </script>
</body>
</html>
